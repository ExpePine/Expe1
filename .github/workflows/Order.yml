name: Blinkit Orders Fetcher

on:
  workflow_dispatch:

jobs:
  fetch-blinkit-orders:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium undetected-chromedriver

      - name: Run Script
        env:
          BLINKIT_COOKIES_JSON: ${{ secrets.BLINKIT_COOKIES_JSON }}
        run: python Order.py

      - name: Upload Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinkit-orders-output
          path: blinkit_output/
