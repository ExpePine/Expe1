name: T2 (Shards 5–9)

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      max-parallel: 2

      matrix:
        shard: [5, 6, 7, 8, 9]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install selenium beautifulsoup4 gspread webdriver-manager

      - name: Create credentials
        run: |
          echo '${{ secrets.GSPREAD_CREDENTIALS }}' > credentials.json

      - name: Create TradingView cookies
        run: |
          echo '${{ secrets.TRADINGVIEW_COOKIES }}' > cookies.json

      - name: Prepare checkpoint
        run: |
          FILE="checkpoint_group2_${{ matrix.shard }}.txt"

          if [ ! -f "$FILE" ]; then
            echo "0" > "$FILE"
          fi

          echo "Checkpoint file: $FILE"
          echo "Checkpoint value:"
          cat "$FILE"

      - name: Run scraper
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_SIZE: 500
          CHECKPOINT_FILE: checkpoint_group2_${{ matrix.shard }}.txt
        run: |
          echo "========================================"
          echo "Shard: $SHARD_INDEX"
          echo "Shard size: $SHARD_SIZE"
          echo "Checkpoint: $CHECKPOINT_FILE"
          echo "========================================"

          python run_scraper.py
